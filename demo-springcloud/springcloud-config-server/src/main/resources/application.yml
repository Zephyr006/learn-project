management:
  endpoints:
    web:
      exposure:
        include: bus-refresh,bus-env
spring:
  cloud:
    config:
      server:
        native:
          search-locations: file:///Users/dong/Desktop/config
  kafka:
    bootstrap-servers: 192.168.1.1:9092
